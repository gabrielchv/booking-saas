name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build, push, deploy to Cloud Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.AR_HOST }}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: "${{ vars.AR_IMAGE }}:${{ github.sha }}"

      - name: Deploy to Cloud Run
        run: >-
          gcloud run deploy "${{ vars.SERVICE_NAME }}"
          --image "${{ vars.AR_IMAGE }}:${{ github.sha }}"
          --region "${{ vars.REGION }}"
          --allow-unauthenticated
